# Build and push Docker image to Docker Hub and GHCR on version tags (e.g. v1.0.0).
# Also runnable manually: Actions → Docker release → Run workflow → enter version (e.g. 1.1.0).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token).
# GHCR uses GITHUB_TOKEN (automatic).
name: Docker release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.0). Leave empty to use the tag that triggered the run.'
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || github.ref }}

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$(sed -n '1p' VERSION | tr -d '\r\n' | sed 's/^v//')" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            darknetz/php-qrcodegenerator:${{ steps.version.outputs.version }}
            darknetz/php-qrcodegenerator:v${{ steps.version.outputs.version }}
            ghcr.io/darknetzz/php-qrcodegenerator:${{ steps.version.outputs.version }}
            ghcr.io/darknetzz/php-qrcodegenerator:v${{ steps.version.outputs.version }}

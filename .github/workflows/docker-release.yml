# Build and push Docker image to Docker Hub and GHCR on version tags (e.g. v1.0.0).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token).
# GHCR uses GITHUB_TOKEN (automatic).
name: Docker release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            darknetz/php-qrcodegenerator:${{ steps.version.outputs.version }}
            darknetz/php-qrcodegenerator:v${{ steps.version.outputs.version }}
            ghcr.io/darknetzz/php-qrcodegenerator:${{ steps.version.outputs.version }}
            ghcr.io/darknetzz/php-qrcodegenerator:v${{ steps.version.outputs.version }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">QR Code Generator Logo</title>
  <desc id="desc">Minimal QR code style logo for the QR Code Generator project.</desc>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="#050816"/>

  <!-- Quiet zone -->
  <rect x="8" y="8" width="48" height="48" fill="#050816" stroke="#1f2937" stroke-width="2" rx="8" ry="8"/>

  <!-- Finder patterns -->
  <rect x="11" y="11" width="14" height="14" fill="#0f172a" rx="3" ry="3"/>
  <rect x="13" y="13" width="10" height="10" fill="#e5f9f4" rx="2" ry="2"/>

  <rect x="39" y="11" width="14" height="14" fill="#0f172a" rx="3" ry="3"/>
  <rect x="41" y="13" width="10" height="10" fill="#e5f9f4" rx="2" ry="2"/>

  <rect x="11" y="39" width="14" height="14" fill="#0f172a" rx="3" ry="3"/>
  <rect x="13" y="41" width="10" height="10" fill="#e5f9f4" rx="2" ry="2"/>

  <!-- Central QR-like pattern -->
  <rect x="30" y="30" width="4" height="4" fill="#22c55e"/>
  <rect x="36" y="30" width="4" height="4" fill="#e5f9f4"/>
  <rect x="30" y="36" width="4" height="4" fill="#e5f9f4"/>
  <rect x="36" y="36" width="4" height="4" fill="#22c55e"/>

  <rect x="24" y="24" width="4" height="4" fill="#e5f9f4"/>
  <rect x="42" y="24" width="4" height="4" fill="#22c55e"/>
  <rect x="24" y="42" width="4" height="4" fill="#22c55e"/>
  <rect x="42" y="42" width="4" height="4" fill="#e5f9f4"/>

  <!-- Accent scan line -->
  <rect x="11" y="26" width="42" height="2" fill="#22c55e" opacity="0.9"/>
</svg>
